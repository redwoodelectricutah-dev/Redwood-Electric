name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/enable-pages.yml

permissions: write-all

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from gh-pages branch root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          payload='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d "$payload")
          echo "POST status $code"
          cat /tmp/pages.json
          echo
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d "$payload")
            echo "PUT status $code"
            cat /tmp/pages.json
            echo
          fi
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            exit 1
          fi
